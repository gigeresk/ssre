name: Windows MSVC build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  LIBTORCH_VERSION: 2.14.1
  OPENCV_VERSION: 4.14.0

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [OFF, ON]
    steps:
      - uses: actions/checkout@v4

      - name: Cache LibTorch and OpenCV
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            libtorch
            opencv
          key: deps-libtorch-${{ env.LIBTORCH_VERSION }}-opencv-${{ env.OPENCV_VERSION }}

      - name: Download LibTorch (CPU, Release) and OpenCV
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-$env:LIBTORCH_VERSION%2Bcpu.zip" -OutFile libtorch.zip
          7z x libtorch.zip -o. -y | Out-Null
          Invoke-WebRequest "https://github.com/opencv/opencv/releases/download/$env:OPENCV_VERSION/opencv-$env:OPENCV_VERSION-windows.exe" -OutFile opencv.exe
          7z x opencv.exe -o. -y | Out-Null
          Remove-Item libtorch.zip, opencv.exe

      - name: Configure
        run: cmake -S . -B build -A x64 -DSSRE_ENGINE=${{ matrix.engine }}

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Export a TorchScript model with matching PyTorch
        if: matrix.engine == 'OFF'
        run: |
          python -m pip install --quiet "torch==${{ env.LIBTORCH_VERSION }}" pillow numpy --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python util/to_torchscript.py --model models/model_epoch_30.pth --output build/model.pt

      - name: Smoke test (2x upscale one frame)
        if: matrix.engine == 'OFF'
        working-directory: build
        run: |
          Release\super_resolve.exe model.pt ..\input\Witcher3_demo-240.png cpu
          if (!(Test-Path output\final_result.jpg)) { throw "no output image" }

      - uses: actions/upload-artifact@v4
        if: matrix.engine == 'OFF'
        with:
          name: super_resolve-win64
          path: |
            build/Release/
            build/output/final_result.jpg
